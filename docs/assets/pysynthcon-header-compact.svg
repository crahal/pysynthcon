<svg xmlns="http://www.w3.org/2000/svg" width="570" height="438" viewBox="0 0 570 438" role="img" aria-labelledby="title desc">
  <title id="title">PySynthCon · Synthetic control in Python</title>
  <desc id="desc">California Proposition 99. From 1970 to 2000, observed and synthetic cigarette sales track closely before the 1989 policy. The estimated mean SDID effect in 1989–2000 is −15.6 packs per capita per year.</desc>
