[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pysynth-control"
version = "0.1.0"
description = "A common interface for synthetic control, SCUL, individual synthetic control, and synthetic difference-in-differences"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "PySynth contributors"}]
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "scikit-learn>=1.3", "requests>=2.31"]

[project.optional-dependencies]
backends = ["pysyncon @ https://github.com/sdfordham/pysyncon/archive/b77dc20e29b012ab03ca1d4caeef7b41861e86f5.zip", "SyntheticControlMethods==1.1.17"]
plot = ["matplotlib>=3.7"]
notebooks = ["matplotlib>=3.7", "jupyterlab>=4", "nbclient>=0.10", "nbformat>=5.9", "ipykernel>=6"]
docs = ["sphinx>=7", "myst-parser>=3"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9", "build>=1.2"]

[project.urls]
Repository = "https://github.com/crahal/PySynth"
Issues = "https://github.com/crahal/PySynth/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not network'"
markers = ["network: downloads academic datasets or checks upstream numerical replications"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
