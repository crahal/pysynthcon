name: Test and document
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[dev,plot]'
      - run: python -m pytest -q
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts

  replication:
    runs-on: ubuntu-22.04
    env:
      OPENBLAS_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-replication.txt -e '.[dev,docs]'
      - run: python -m pytest -q -m 'network or not network' --cov=pysynth --cov-report=xml
      - run: python -m sphinx -W --keep-going -b html docs docs/_build/html
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-and-docs
          path: |
            dist/
            docs/_build/html/
            coverage.xml

  notebooks:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-replication.txt -e .
      - run: python scripts/execute_notebooks.py --output-dir executed-notebooks
      - uses: actions/upload-artifact@v4
        with:
          name: executed-notebooks
          path: executed-notebooks/
